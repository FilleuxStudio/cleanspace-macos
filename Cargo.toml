[package]
name = "clean-uninstall"
version = "0.1.0"
edition = "2021"

[lib]
name = "clean_uninstall_core"
path = "src/lib.rs"

[[bin]]
name = "clean-uninstall"
path = "src/bin/cli.rs"

[[bin]]
name = "clean-uninstall-gui"
path = "src/bin/gui.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
libc = "0.2"
eframe = "0.28"
egui = "0.28"

[profile.release]
opt-level = 2